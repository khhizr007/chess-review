<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening your review · KnightReview</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="ui.css" />
    <script type="module" src="redirect.js"></script>
  </head>
  <body>
    <header class="topbar">
      <span class="logo">
        <img src="icons/icon-128.png" alt="" />
        <span class="logo__word">Knight<span class="logo__accent">Review</span></span>
      </span>
    </header>
    <main class="main">
      <section class="card">
        <div class="opening">
          <span class="spinner" id="spinner" aria-hidden="true"></span>
          <h1 id="status" role="status">Opening your review…</h1>
        </div>
        <div class="notice" id="error" hidden></div>
        <p class="lede" id="help" hidden>
          Check your <a href="options.html" target="_blank">extension settings</a>, or open
          <a href="https://knightreview.online/" target="_blank" rel="noopener">knightreview.online</a> directly.
        </p>
      </section>
    </main>
  </body>
</html>
