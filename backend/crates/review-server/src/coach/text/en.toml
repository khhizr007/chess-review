# English coach text. Every word in this file was written for this project.
#
# A sentence is a frame (chosen by circumstance and style) with the tag's
# phrase in {pred}. A frame lists one or more wordings; one is picked per move.
# Styles: `you` talks to the player about their own move, `opponent` talks to
# the player about the other side's move, `neutral` names the sides. A frame
# without a `you` or `opponent` wording uses the `neutral` one.
#
# Placeholders:
#   {move}        the move under review
#   {reply}       the move that carries out the event
#   {line}        the moves of the line before {reply}
#   {best}        the engine's best move
#   {mover}       who played {move}: "you", "your opponent", "White", "Black"
#   {mover_s}     the same as an owner: "your", "their", "White's", "Black's"
#   {from} {to}   how the game stood for {mover} before and after {move} ("equal", "worse")
#   {piece}       the piece in focus with its owner and square ("your knight on f6")
#   {piece_role}  the same without the square ("your knight")
#   {square}      the square in focus
#   {targets}     the other pieces involved ("your queen on d8 and rook on h8")
#   {gain}        the material won ("a knight", "two pawns")
#   {n}           moves to mate
#   {pred}        (frames only) the tag's phrase

# ---------------------------------------------------------------- frames

# The move itself is the problem.
[frame.base]
neutral = ["{move} {pred}."]

[frame.base_refuted]
neutral = ["{move} {pred}, and {reply} wins {gain}.", "{move} {pred}, so {reply} wins {gain}."]

# The move loses a piece in an exchange, not for free.
[frame.base_loses]
neutral = ["{move} {pred} and loses material after {reply}.", "{move} {pred}: after {reply}, it loses material."]

# The move allows the opponent's best reply to do something.
[frame.permits]
neutral = ["{move} allows {reply}, which {pred}.", "After {move}, {reply} {pred}."]

[frame.permits_line]
neutral = ["{move} allows {line}, and then {reply} {pred}.", "After {move} {line}, {reply} {pred}."]

# As above, when the line before {reply} is too long to spell out.
[frame.permits_long]
neutral = ["{move} allows a sequence that ends with {reply}, which {pred}."]

# The best move would have done something.
[frame.misses]
you = ["You missed {reply}, which {pred}.", "{reply} was the move here: it {pred}."]
opponent = ["Your opponent missed {reply}, which {pred}.", "{reply} was the move here: it {pred}."]
neutral = ["{mover} missed {reply}, which {pred}.", "{reply} was the move here: it {pred}."]

[frame.misses_line]
you = ["You missed a chance: after {line}, {reply} {pred}."]
opponent = ["Your opponent missed a chance: after {line}, {reply} {pred}."]
neutral = ["{mover} missed a chance: after {line}, {reply} {pred}."]

[frame.misses_long]
you = ["You missed a sequence that ends with {reply}, which {pred}."]
opponent = ["Your opponent missed a sequence that ends with {reply}, which {pred}."]
neutral = ["{mover} missed a sequence that ends with {reply}, which {pred}."]

# The best move would have taken the piece the other side just left hanging.
[frame.misses_same]
you = ["You missed {reply}, which wins {piece}: it had just been left hanging."]
opponent = ["Your opponent missed {reply}, which wins {piece}: it had just been left hanging."]
neutral = ["{mover} missed {reply}, which wins {piece}: it had just been left hanging."]

# The best move would have threatened something: {reply} is the threat, the
# move that would follow if the other side did nothing.
[frame.misses_threatens]
you = ["You missed {best}, which threatens {reply}: it {pred}."]
opponent = ["Your opponent missed {best}, which threatens {reply}: it {pred}."]
neutral = ["{mover} missed {best}, which threatens {reply}: it {pred}."]

# The best move would have stopped the other side's threat {reply}.
[frame.misses_prevents]
you = ["You missed {best}, which stops {reply}: it {pred}."]
opponent = ["Your opponent missed {best}, which stops {reply}: it {pred}."]
neutral = ["{mover} missed {best}, which stops {reply}: it {pred}."]

# The best move was a sacrifice.
[frame.misses_sacrifice]
you = ["You missed {best}, a sacrifice that works."]
opponent = ["Your opponent missed {best}, a sacrifice that works."]
neutral = ["{mover} missed {best}, a sacrifice that works."]

# The best move was the only one that kept the game in hand.
[frame.misses_only]
you = ["You missed {best}, the only good move here."]
opponent = ["Your opponent missed {best}, the only good move here."]
neutral = ["{mover} missed {best}, the only good move here."]

# A forced move: there was no other legal move.
[frame.forced]
you = ["{move} was your only legal move."]
opponent = ["{move} was your opponent's only legal move."]
neutral = ["{move} was the only legal move."]

# What was better, after the main sentence.
[frame.best]
neutral = ["Better was {best}.", "{best} was the better move."]

[frame.best_event]
neutral = ["Better was {best}, which {pred}.", "{best} was better: it {pred}."]

[frame.best_line]
neutral = ["Better was {best}: after {line}, {reply} {pred}."]

[frame.best_long]
neutral = ["Better was {best}, starting a sequence that ends with {reply}, which {pred}."]

[frame.best_threatens]
neutral = ["Better was {best}, threatening {reply}, which {pred}.", "{best} was better: it threatens {reply}, which {pred}."]

[frame.best_prevents]
neutral = ["Better was {best}, stopping {reply}, which {pred}.", "{best} was better: it stops {reply}, which {pred}."]

[frame.best_sacrifice]
neutral = ["Better was {best}, a sacrifice that works."]

[frame.best_only]
neutral = ["Better was {best}, the only good move here.", "{best} was the only good move here."]

# A move that let the game slip by a step with no tactic to name.
[frame.slide]
neutral = ["{move} lets {mover_s} position slide from {from} to {to}."]

# A good move: what it does by itself or on its own line. {reply} is the move
# that does it ({move} itself when the event is on the first move).
[frame.good]
neutral = ["{reply} {pred}."]

[frame.good_line]
neutral = ["After {line}, {reply} {pred}.", "{line}, and then {reply} {pred}."]

[frame.good_long]
neutral = ["{move} starts a sequence that ends with {reply}, which {pred}."]

# A good move that gives up material on purpose (followed by what it leads to).
[frame.sacrifice]
neutral = ["{move} {pred}, and it pays off."]

# A good move that is the only one keeping the game in hand.
[frame.only]
neutral = ["{move} is the only good move here."]

# What the move threatens: the mover's next move if the other side did nothing.
[frame.threatens]
neutral = ["{move} threatens {reply}, which {pred}.", "{move} sets up a threat: {reply} {pred}."]

# What the move stops: the other side's threat before it.
[frame.prevents]
neutral = ["{move} stops {reply}, which {pred}.", "{move} defends against {reply}, which {pred}."]

# Brilliant and Great moves. `brilliant` and `great_find` stand alone (before a
# frame with no wording of its own); the others replace the frame named after
# the prefix.
[frame.brilliant]
neutral = ["{move} gives up material, and it pays off."]

[frame.brilliant_good]
neutral = ["{move} is a sacrifice that works: it {pred}."]

[frame.brilliant_good_line]
neutral = ["{move} is a sacrifice that works: after {line}, {reply} {pred}."]

[frame.brilliant_good_long]
neutral = ["{move} is a sacrifice that works: it starts a sequence that ends with {reply}, which {pred}."]

[frame.brilliant_threatens]
neutral = ["{move} is a sacrifice that works: it threatens {reply}, which {pred}."]

[frame.brilliant_prevents]
neutral = ["{move} is a sacrifice that works: it stops {reply}, which {pred}."]

[frame.brilliant_sacrifice]
neutral = ["{move} is a sacrifice: it {pred}, and that pays off."]

[frame.great_find]
neutral = ["{move} is the one strong move here: the others are clearly worse."]

[frame.great_find_good]
neutral = ["{move} is the one strong move here: it {pred}."]

[frame.great_find_good_line]
neutral = ["{move} is the one strong move here: after {line}, {reply} {pred}."]

[frame.great_find_good_long]
neutral = ["{move} is the one strong move here: it starts a sequence that ends with {reply}, which {pred}."]

[frame.great_find_threatens]
neutral = ["{move} is the one strong move here: it threatens {reply}, which {pred}."]

[frame.great_find_prevents]
neutral = ["{move} is the one strong move here: it stops {reply}, which {pred}."]

[frame.great_find_only]
neutral = ["{move} is the one strong move here: the others all fall short."]

# A book move, said with its development idea.
[frame.book_good]
neutral = ["{reply} is a book move: it {pred}.", "{reply}, a book move, {pred}."]

# The best move is hard to find at the player's level (from a human-move
# model): what was missed is said gently. Each replaces the frame without
# `_hard`.
[frame.misses_hard]
you = ["{reply} was hard to find at this level, but it {pred}."]
opponent = ["{reply} was hard to find at this level, but it {pred}."]
neutral = ["{reply} was hard to find at this level, but it {pred}."]

[frame.misses_line_hard]
neutral = ["A hard chance to see at this level: after {line}, {reply} {pred}."]

[frame.misses_long_hard]
neutral = ["A hard sequence to find at this level ends with {reply}, which {pred}."]

[frame.misses_threatens_hard]
neutral = ["{best} was hard to find at this level: it threatens {reply}, which {pred}."]

[frame.misses_prevents_hard]
neutral = ["{best} was hard to find at this level: it stops {reply}, which {pred}."]

[frame.misses_sacrifice_hard]
neutral = ["{best} was a sacrifice that works, hard to find at this level."]

[frame.misses_only_hard]
neutral = ["{best} was the only good move here, and a hard one to find at this level."]

[frame.best_hard]
neutral = ["Better was {best}, though it is hard to find at this level."]

[frame.best_event_hard]
neutral = ["Better was {best}, a hard move to find at this level: it {pred}."]

[frame.best_line_hard]
neutral = ["Better was {best}, hard to find at this level: after {line}, {reply} {pred}."]

[frame.best_long_hard]
neutral = ["Better was {best}, hard to find at this level: it starts a sequence that ends with {reply}, which {pred}."]

[frame.best_threatens_hard]
neutral = ["Better was {best}, hard to find at this level: it threatens {reply}, which {pred}."]

[frame.best_prevents_hard]
neutral = ["Better was {best}, hard to find at this level: it stops {reply}, which {pred}."]

[frame.best_sacrifice_hard]
neutral = ["Better was {best}, a sacrifice that works, though hard to find at this level."]

[frame.best_only_hard]
neutral = ["Better was {best}, the only good move here and a hard one to find at this level."]

# A bad move that players of this level often play (from a human-move
# model): the sentence leads with the check that was skipped. Each replaces
# the frame without `_natural`.
[frame.base_natural]
neutral = ["{move} looks natural, but it {pred}."]

[frame.base_refuted_natural]
neutral = ["{move} looks natural, but check the reply first: it {pred}, and {reply} wins {gain}."]

[frame.base_loses_natural]
neutral = ["{move} looks natural, but check the reply first: it {pred} and loses material after {reply}."]

[frame.permits_natural]
neutral = ["{move} looks natural, but check the reply first: {reply} {pred}."]

[frame.permits_line_natural]
neutral = ["{move} looks natural, but check the replies first: after {line}, {reply} {pred}."]

[frame.permits_long_natural]
neutral = ["{move} looks natural, but it allows a sequence that ends with {reply}, which {pred}."]

