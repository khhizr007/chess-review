services:
  chess-review:
    build:
      context: .
      args:
        # Optional sound pack from another GitHub repository (see the Dockerfile's "Sound pack").
        # Set these in a .env file next to this one, e.g. SOUNDS_REPO=khhizr007/chess_sounds.
        SOUNDS_REPO: ${SOUNDS_REPO:-}
        SOUNDS_REF: ${SOUNDS_REF:-master}
      secrets:
        - github_token
    image: chess-review
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Each Stockfish process holds about 370 MB and Maia about 400 MB; size the pool to the host.
      # Override in .env on small hosts, e.g. ENGINE_POOL_SIZE=1 on a 2 GB Raspberry Pi.
      ENGINE_POOL_SIZE: ${ENGINE_POOL_SIZE:-2}
      MAX_CONCURRENT_REVIEWS: ${MAX_CONCURRENT_REVIEWS:-2}
    volumes:
      # Finished reviews, kept for a day across restarts and rebuilds.
      - reviews:/app/data/reviews
    restart: unless-stopped

volumes:
  reviews:

secrets:
  # Read from the GITHUB_TOKEN environment variable at build time; empty is fine for a public repo.
  github_token:
    environment: GITHUB_TOKEN
